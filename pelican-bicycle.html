<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --ink: #16323d;
      --cream: #fff8e8;
      --coral: #ef765f;
      --teal: #2c9b99;
      --yellow: #f6c657;
      --sky: #a8d8df;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 50% 7%, rgba(255,255,255,.8), transparent 28rem),
        linear-gradient(#f1b86b 0%, #f5cf87 39%, #a7d5d4 40%, #80bab9 100%);
    }

    .stage {
      width: min(1100px, 100vw);
      height: min(740px, 100vh);
      min-height: 560px;
      position: relative;
      overflow: hidden;
      background: #f6d891;
      box-shadow: 0 20px 60px rgba(35, 67, 68, .22);
      border: 8px solid var(--cream);
    }

    .title {
      position: absolute;
      z-index: 4;
      top: 26px;
      left: 32px;
      margin: 0;
      letter-spacing: .08em;
      font-size: clamp(1.4rem, 3vw, 2.45rem);
      font-weight: 850;
    }

    .subtitle {
      position: absolute;
      z-index: 4;
      top: 76px;
      left: 35px;
      margin: 0;
      font-size: .75rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .64;
    }

    .controls {
      position: absolute;
      z-index: 5;
      right: 24px;
      top: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: rgba(255, 248, 232, .72);
      border: 2px solid rgba(22, 50, 61, .12);
      border-radius: 8px;
      backdrop-filter: blur(8px);
    }

    button, select {
      height: 34px;
      border: 2px solid var(--ink);
      border-radius: 5px;
      background: var(--cream);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button { width: 40px; display: grid; place-items: center; font-size: 1rem; }
    select { padding: 0 7px; font-size: .78rem; }
    button:hover, select:hover { background: var(--yellow); }

    svg { width: 100%; height: 100%; display: block; }

    .cloud { animation: drift 18s linear infinite; }
    .cloud.slow { animation-duration: 28s; animation-direction: reverse; }
    .bird { animation: wing 1.2s ease-in-out infinite; transform-origin: center; }
    .bike-rider { animation: bob .55s ease-in-out infinite; transform-origin: 50% 80%; }
    .wheel { animation: spin .8s linear infinite; transform-box: fill-box; transform-origin: center; }
    .leg-a { animation: pedalA .8s linear infinite; transform-origin: 50% 50%; }
    .leg-b { animation: pedalB .8s linear infinite; transform-origin: 50% 50%; }
    .road-line { animation: road 1.1s linear infinite; }
    .spark { animation: twinkle 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spark:nth-child(2) { animation-delay: -.4s; }
    .spark:nth-child(3) { animation-delay: -.9s; }

    .paused * { animation-play-state: paused !important; }

    @keyframes drift { from { transform: translateX(-190px); } to { transform: translateX(1150px); } }
    @keyframes wing { 0%, 100% { transform: rotate(3deg); } 50% { transform: rotate(-8deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pedalA { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pedalB { from { transform: rotate(180deg); } to { transform: rotate(540deg); } }
    @keyframes road { from { transform: translateX(0); } to { transform: translateX(-170px); } }
    @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.7); } 50% { opacity: .8; transform: scale(1.15); } }

    @media (max-width: 640px) {
      .stage { min-height: 460px; height: 100vh; border-width: 5px; }
      .title { top: 18px; left: 19px; }
      .subtitle { top: 57px; left: 21px; }
      .controls { top: 18px; right: 16px; transform: scale(.86); transform-origin: top right; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <h1 class="title">鹈鹕上路</h1>
    <p class="subtitle">A tiny SVG adventure</p>
    <div class="controls" aria-label="动画控制">
      <button id="toggle" type="button" title="暂停动画" aria-label="暂停动画">Ⅱ</button>
      <button id="replay" type="button" title="重新开始" aria-label="重新开始">↻</button>
      <select id="speed" aria-label="动画速度">
        <option value="0.65">慢速</option>
        <option value="1" selected>标准</option>
        <option value="1.45">加速</option>
      </select>
    </div>

    <svg viewBox="0 0 1100 740" role="img" aria-label="一只鹈鹕骑着自行车穿过海边公路">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f6b26a"/>
          <stop offset=".55" stop-color="#f8d78d"/>
          <stop offset="1" stop-color="#a8d8d5"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop stop-color="#537b7e"/>
          <stop offset="1" stop-color="#294b55"/>
        </linearGradient>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="8"/>
        </filter>
      </defs>

      <rect width="1100" height="740" fill="url(#sky)"/>
      <circle cx="855" cy="178" r="82" fill="#fff1b8" opacity=".84"/>
      <circle cx="855" cy="178" r="112" fill="none" stroke="#fff1b8" stroke-width="3" opacity=".3"/>
      <g class="spark" fill="#fff7cc">
        <circle cx="730" cy="132" r="4"/><circle cx="944" cy="98" r="3"/><circle cx="1000" cy="215" r="4"/>
      </g>

      <g class="cloud" fill="#fff6dc" opacity=".82">
        <path d="M-100 180 Q-62 137 -12 169 Q14 115 78 151 Q112 136 143 174 Q184 177 193 211 H-100Z"/>
      </g>
      <g class="cloud slow" fill="#fff6dc" opacity=".52">
        <path d="M690 105 Q725 67 766 98 Q796 45 855 93 Q899 81 925 122 Q969 123 982 153 H690Z"/>
      </g>

      <path d="M0 385 Q160 330 310 375 T620 365 T1100 350 V512 H0Z" fill="#397f83" opacity=".82"/>
      <path d="M0 427 Q155 384 314 422 T620 411 T1100 399 V532 H0Z" fill="#267174" opacity=".86"/>
      <path d="M0 489 Q155 458 314 487 T620 480 T1100 467 V563 H0Z" fill="#195e67"/>
      <path d="M0 548 Q220 514 430 545 T800 536 T1100 526 V740 H0Z" fill="url(#road)"/>

      <g class="road-line" fill="#e7cf8a" opacity=".8">
        <path d="M-80 671 H110 L173 682 H-80Z"/><path d="M288 671 H480 L538 682 H300Z"/>
        <path d="M655 671 H858 L919 682 H675Z"/><path d="M1030 671 H1190 L1250 682 H1050Z"/>
      </g>
      <ellipse cx="550" cy="646" rx="210" ry="26" fill="#172f3b" opacity=".28" filter="url(#shadow)"/>

      <g class="bike-rider" stroke="#16323d" stroke-linecap="round" stroke-linejoin="round">
        <!-- bicycle -->
        <g fill="none" stroke-width="6">
          <circle class="wheel" cx="395" cy="615" r="74" stroke="#f5ead0"/>
          <circle class="wheel" cx="725" cy="615" r="74" stroke="#f5ead0"/>
          <path d="M395 615 L506 493 L595 615 L395 615 L725 615 L595 615 L558 488 H506"/>
          <path d="M506 493 L488 462 M470 462 H506 M725 615 L760 472"/>
        </g>
        <g fill="#f5ead0" stroke-width="4" opacity=".8">
          <circle cx="395" cy="615" r="7"/><circle cx="725" cy="615" r="7"/>
        </g>
        <!-- pedal crank -->
        <g class="leg-a" fill="none" stroke-width="5">
          <path d="M595 615 L630 585 M624 579 H648"/>
        </g>
        <g class="leg-b" fill="none" stroke-width="5">
          <path d="M595 615 L566 646 M545 650 H570"/>
        </g>

        <!-- rider -->
        <g class="bird">
          <path d="M513 398 Q478 363 498 308 Q523 241 610 242 Q689 244 706 311 Q718 359 681 398 Q632 433 566 416Z" fill="#f7f0dc" stroke-width="7"/>
          <path d="M541 285 Q575 216 649 250 Q693 268 697 334 Q655 302 617 317 Q577 329 541 285Z" fill="#d8e7df" stroke-width="5"/>
          <path d="M654 301 Q697 277 754 302 Q802 322 847 349 Q802 388 747 374 Q696 361 665 343Z" fill="#ee765f" stroke-width="7"/>
          <path d="M758 329 Q808 324 852 349 Q812 371 769 365Z" fill="#f7ad68" stroke-width="4"/>
          <circle cx="667" cy="283" r="10" fill="#16323d" stroke="none"/>
          <circle cx="671" cy="279" r="3.5" fill="#fff8e8" stroke="none"/>
          <path d="M574 414 Q560 465 540 490 M648 412 Q670 454 687 490" fill="none" stroke-width="12"/>
          <path d="M540 490 Q512 492 494 477 M687 490 Q708 492 727 478" fill="none" stroke-width="8"/>
          <!-- wing in front -->
          <path d="M565 326 Q520 329 488 385 Q476 405 502 414 Q555 409 602 367Z" fill="#c9ddd7" stroke-width="6"/>
          <path d="M516 383 Q546 362 575 351" fill="none" stroke-width="3" opacity=".6"/>
        </g>
      </g>

      <g fill="#d9efdc" opacity=".65">
        <path d="M130 553 q12-30 24 0 q14-45 28 0 q12-25 24 0Z"/>
        <path d="M940 535 q12-35 24 0 q17-46 30 0 q12-28 24 0Z"/>
      </g>
      <text x="50" y="686" fill="#f5ead0" opacity=".68" font-size="14" letter-spacing="4">KEEP MOVING / KEEP WINGING</text>
    </svg>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const toggle = document.getElementById("toggle");
    const replay = document.getElementById("replay");
    const speed = document.getElementById("speed");
    let paused = false;

    toggle.addEventListener("click", () => {
      paused = !paused;
      stage.classList.toggle("paused", paused);
      toggle.textContent = paused ? "▶" : "Ⅱ";
      toggle.title = paused ? "继续动画" : "暂停动画";
      toggle.setAttribute("aria-label", toggle.title);
    });

    replay.addEventListener("click", () => {
      stage.classList.remove("paused");
      paused = false;
      toggle.textContent = "Ⅱ";
      document.querySelectorAll(".cloud, .bird, .bike-rider, .wheel, .leg-a, .leg-b, .road-line, .spark")
        .forEach((node) => {
          node.style.animation = "none";
          void node.offsetWidth;
          node.style.animation = "";
        });
    });

    speed.addEventListener("change", () => {
      document.documentElement.style.setProperty("--speed", speed.value);
      document.querySelectorAll("*").forEach((node) => {
        const duration = getComputedStyle(node).animationDuration;
        if (duration !== "0s" && duration !== "normal") {
          const seconds = parseFloat(duration);
          node.style.animationDuration = `${seconds / Number(speed.value)}s`;
        }
      });
    });
  </script>
</body>
</html>
